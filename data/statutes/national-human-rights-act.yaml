id: national-human-rights-act
name: 국가인권위원회법
articles:
  제2조:
    title: 정의
    text: '제2조(정의) 이 법에서 사용하는 용어의 뜻은 다음과 같다. <개정 2016.2.3, 2020.2.4, 2022.1.4, 2022.4.26>


      1.  "인권"이란 「대한민국헌법」 및 법률에서 보장하거나 대한민국이 가입ㆍ비준한 국제인권조약 및 국제관습법에서 인정하는 인간으로서의 존엄과 가치 및 자유와 권리를 말한다.


      2.  "구금ㆍ보호시설"이란 다음 각 목에 해당하는 시설을 말한다.


      가.  교도소ㆍ소년교도소ㆍ구치소 및 그 지소, 보호감호소, 치료감호시설, 소년원 및 소년분류심사원


      나.  경찰서 유치장 및 사법경찰관리가 직무 수행을 위하여 사람을 조사하고 유치(留置)하거나 수용하는 데에 사용하는 시설


      다.  군 교도소(지소ㆍ미결수용실을 포함한다)


      라.  외국인 보호소


      마.  다수인 보호시설(많은 사람을 보호하고 수용하는 시설로서 대통령령으로 정하는 시설을 말한다)


      3.  "평등권 침해의 차별행위"란 합리적인 이유 없이 성별, 종교, 장애, 나이, 사회적 신분, 출신 지역(출생지, 등록기준지, 성년이 되기 전의 주된 거주지 등을 말한다), 출신 국가, 출신 민족, 용모
      등 신체 조건, 기혼ㆍ미혼ㆍ별거ㆍ이혼ㆍ사별ㆍ재혼ㆍ사실혼 등 혼인 여부, 임신 또는 출산, 가족 형태 또는 가족 상황, 인종, 피부색, 사상 또는 정치적 의견, 형의 효력이 실효된 전과(前科), 성적(性的) 지향,
      학력, 병력(病歷) 등을 이유로 한 다음 각 목의 어느 하나에 해당하는 행위를 말한다. 다만, 현존하는 차별을 없애기 위하여 특정한 사람(특정한 사람들의 집단을 포함한다. 이하 이 조에서 같다)을 잠정적으로
      우대하는 행위와 이를 내용으로 하는 법령의 제정ㆍ개정 및 정책의 수립ㆍ집행은 평등권 침해의 차별행위(이하 "차별행위"라 한다)로 보지 아니한다.


      가.  고용(모집, 채용, 교육, 배치, 승진, 임금 및 임금 외의 금품 지급, 자금의 융자, 정년, 퇴직, 해고 등을 포함한다)과 관련하여 특정한 사람을 우대ㆍ배제ㆍ구별하거나 불리하게 대우하는 행위


      나.  재화ㆍ용역ㆍ교통수단ㆍ상업시설ㆍ토지ㆍ주거시설의 공급이나 이용과 관련하여 특정한 사람을 우대ㆍ배제ㆍ구별하거나 불리하게 대우하는 행위


      다.  교육시설이나 직업훈련기관에서의 교육ㆍ훈련이나 그 이용과 관련하여 특정한 사람을 우대ㆍ배제ㆍ구별하거나 불리하게 대우하는 행위


      라.  성희롱[업무, 고용, 그 밖의 관계에서 공공기관(국가기관, 지방자치단체, 「초ㆍ중등교육법」 제2조, 「고등교육법」 제2조와 그 밖의 다른 법률에 따라 설치된 각급 학교, 「공직자윤리법」 제3조의2제1항에
      따른 공직유관단체를 말한다)의 종사자, 사용자 또는 근로자가 그 직위를 이용하여 또는 업무 등과 관련하여 성적 언동 등으로 성적 굴욕감 또는 혐오감을 느끼게 하거나 성적 언동 또는 그 밖의 요구 등에 따르지
      아니한다는 이유로 고용상의 불이익을 주는 것을 말한다] 행위


      4.  "장애"란 신체적ㆍ정신적ㆍ사회적 요인으로 장기간에 걸쳐 일상생활 또는 사회생활에 상당한 제약을 받는 상태를 말한다.


      5.  "시민사회단체"란 「비영리민간단체 지원법」 제4조에 따라 중앙행정기관의 장, 시ㆍ도지사나 특례시의 장에게 등록을 한 비영리민간단체, 「민법」 제32조에 따라 주무관청의 허가를 받은 비영리법인, 「공익법인의
      설립ㆍ운영에 관한 법률」 제4조에 따라 주무관청의 설립허가를 받은 공익법인, 그 밖에 특별법에 따라 설립된 법인을 말한다.


      6.  "군인등"이란 다음 각 목의 어느 하나에 해당하는 사람을 말한다.


      가.  「군인의 지위 및 복무에 관한 기본법」 제2조제1호에 따른 현역에 복무하는 장교ㆍ준사관ㆍ부사관 및 병(兵)


      나.  「군인의 지위 및 복무에 관한 기본법」 제3조에 따른 사관생도ㆍ사관후보생ㆍ준사관후보생ㆍ부사관후보생, 소집되어 군에 복무하는 예비역ㆍ보충역, 군무원


      7.  "군인권침해"란 제30조제1항에 따른 인권침해나 차별행위에 해당하는 경우로서 군인등의 복무 중 업무 수행 과정 또는 병영생활(「군인의 지위 및 복무에 관한 기본법」 제2조제5호에 따른 병영생활을 말한다)에서
      발생하는 인권침해나 차별행위를 말한다.


      8.  "군인권보호관"이란 「군인의 지위 및 복무에 관한 기본법」 제42조에 따른 군인권보호관을 말한다.


      [전문개정 2011.5.19]'
