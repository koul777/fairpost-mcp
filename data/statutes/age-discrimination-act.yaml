id: age-discrimination-act
name: 고용상 연령차별금지 및 고령자고용촉진에 관한 법률
articles:
  제4조의4:
    title: 모집ㆍ채용 등에서의 연령차별 금지
    text: '제4조의4(모집ㆍ채용 등에서의 연령차별 금지)


      ① 사업주는 다음 각 호의 분야에서 합리적인 이유 없이 연령을 이유로 근로자 또는 근로자가 되려는 사람을 차별하여서는 아니 된다. <개정 2020.5.26>


      1.  모집ㆍ채용


      2.  임금, 임금 외의 금품 지급 및 복리후생


      3.  교육ㆍ훈련


      4.  배치ㆍ전보ㆍ승진


      5.  퇴직ㆍ해고


      ② 제1항을 적용할 때 합리적인 이유 없이 연령 외의 기준을 적용하여 특정 연령집단에 특히 불리한 결과를 초래하는 경우에는 연령차별로 본다.


      [본조신설 2008.3.21]'
    effective_date: '2022-06-10'
    hash: sha256:2fd394810167789f06d03eb945c1824202da950c43f39887c529faab01ef8c7e
  제4조의5:
    title: 차별금지의 예외
    text: '제4조의5(차별금지의 예외) 다음 각 호의 어느 하나에 해당하는 경우에는 제4조의4에 따른 연령차별로 보지 아니한다.


      1.  직무의 성격에 비추어 특정 연령기준이 불가피하게 요구되는 경우


      2.  근속기간의 차이를 고려하여 임금이나 임금 외의 금품과 복리후생에서 합리적인 차등을 두는 경우


      3.  이 법이나 다른 법률에 따라 근로계약, 취업규칙, 단체협약 등에서 정년을 설정하는 경우


      4.  이 법이나 다른 법률에 따라 특정 연령집단의 고용유지ㆍ촉진을 위한 지원조치를 하는 경우


      [본조신설 2008.3.21]'
    effective_date: '2022-06-10'
