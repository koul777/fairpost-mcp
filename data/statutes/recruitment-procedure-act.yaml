id: recruitment-procedure-act
name: 채용절차의 공정화에 관한 법률
articles:
  제4조:
    title: 거짓 채용광고 등의 금지
    text: '제4조(거짓 채용광고 등의 금지)


      ① 구인자는 채용을 가장하여 아이디어를 수집하거나 사업장을 홍보하기 위한 목적 등으로 거짓의 채용광고를 내서는 아니 된다.


      ② 구인자는 정당한 사유 없이 채용광고의 내용을 구직자에게 불리하게 변경하여서는 아니 된다.


      ③ 구인자는 구직자를 채용한 후에 정당한 사유 없이 채용광고에서 제시한 근로조건을 구직자에게 불리하게 변경하여서는 아니 된다.


      ④ 구인자는 구직자에게 채용서류 및 이와 관련한 저작권 등의 지식재산권을 자신에게 귀속하도록 강요하여서는 아니 된다.'
    effective_date: '2020-05-26'
    hash: sha256:c5059bff0a97e9dbd5098e16ef82bb744932a665ea735c576271725019d23c9b
  제4조의3:
    title: 출신지역 등 개인정보 요구 금지
    text: '제4조의3(출신지역 등 개인정보 요구 금지) 구인자는 구직자에 대하여 그 직무의 수행에 필요하지 아니한 다음 각 호의 정보를 기초심사자료에 기재하도록 요구하거나 입증자료로 수집하여서는 아니 된다.


      1.  구직자 본인의 용모ㆍ키ㆍ체중 등의 신체적 조건


      2.  구직자 본인의 출신지역ㆍ혼인여부ㆍ재산


      3.  구직자 본인의 직계 존비속 및 형제자매의 학력ㆍ직업ㆍ재산


      [본조신설 2019.4.16]'
    effective_date: '2020-05-26'
    hash: sha256:d09e9d92b6f4e09ef0f8c2205a98ac10faa7260e5a690661a1ffc6c0dc403653
  제8조:
    title: 채용일정 및 채용과정의 고지
    text: 제8조(채용일정 및 채용과정의 고지) 구인자는 구직자에게 채용일정, 채용심사 지연의 사실, 채용과정의 변경 등 채용과정을 알려야 한다. 이 경우 고지방법은 제7조제2항을 준용한다. <개정 2019.4.16>
    effective_date: '2020-05-26'
    hash: sha256:e8bd859922477859da391a342b4d3711698af54bc158a6544cfb4f0cd9435ad7
  제9조:
    title: 채용심사비용의 부담금지
    text: 제9조(채용심사비용의 부담금지) 구인자는 채용심사를 목적으로 구직자에게 채용서류 제출에 드는 비용 이외의 어떠한 금전적 비용(이하 “채용심사비용”이라고 한다)도 부담시키지 못한다. 다만, 사업장 및 직종의 특수성으로 인하여 불가피한 사정이 있는 경우 고용노동부장관의 승인을 받아 구직자에게 채용심사비용의 일부를 부담하게 할 수 있다. <개정 2020. 5. 26.>
    effective_date: '2020-05-26'
    hash: sha256:14bc4cad440ea79384b72399b5a4c0490ab4818c57f8f44e0bd3107910c3dd79
    verified_via: 국가법령정보센터 법령 본문ㆍ고용노동부 FAQ
  제10조:
    title: 채용 여부의 고지
    text: 제10조(채용 여부의 고지) 구인자는 채용대상자를 확정한 경우에는 지체 없이 구직자에게 채용 여부를 알려야 한다. 이 경우 고지방법은 제7조제2항을 준용한다.
    effective_date: '2020-05-26'
    hash: sha256:618c63652891c18cb4452688421477de8ae147fd509b97a30bbbad7da5019af8
  제11조:
    title: 채용서류의 반환 등
    text: '제11조(채용서류의 반환 등)


      ① 구인자는 구직자의 채용 여부가 확정된 이후 구직자(확정된 채용대상자는 제외한다)가 채용서류의 반환을 청구하는 경우에는 본인임을 확인한 후 대통령령으로 정하는 바에 따라 반환하여야 한다. 다만, 제7조제1항에
      따라 홈페이지 또는 전자우편으로 제출된 경우나 구직자가 구인자의 요구 없이 자발적으로 제출한 경우에는 그러하지 아니하다.


      ② 제1항에 따른 구직자의 채용서류 반환 청구는 서면 또는 전자적 방법 등 고용노동부령으로 정하는 바에 따라 하여야 한다.


      ③ 구인자는 제1항에 따른 구직자의 반환 청구에 대비하여 대통령령으로 정하는 기간 동안 채용서류를 보관하여야 한다. 다만, 천재지변이나 그 밖에 구인자에게 책임 없는 사유로 채용서류가 멸실된 경우 구인자는 제1항에
      따른 채용서류의 반환 의무를 이행한 것으로 본다.


      ④ 구인자는 대통령령으로 정한 반환의 청구기간이 지난 경우 및 채용서류를 반환하지 아니한 경우에는 「개인정보 보호법」에 따라 채용서류를 파기하여야 한다.


      ⑤ 제1항에 따른 채용서류의 반환에 소요되는 비용은 원칙적으로 구인자가 부담한다. 다만, 구인자는 대통령령으로 정하는 범위에서 채용서류의 반환에 소요되는 비용을 구직자에게 부담하게 할 수 있다.


      ⑥ 구인자는 제1항부터 제5항까지의 규정을 채용 여부가 확정되기 전까지 구직자에게 알려야 한다.'
    effective_date: '2020-05-26'
    hash: sha256:953b8078c8f38a9c27804031c2d923ce643219047189bca2be05902dc7ef1f87
