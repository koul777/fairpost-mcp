controls:
- id: ncs-job-relevance
  title: 직무관련성 중심 요건
  statement: 지원 요건과 평가 요소는 직무 수행에 필요한 지식ㆍ기술ㆍ태도 및 경험과 연결하고 그 이유를 기록한다.
  scope: all_employers_guidance
  question_ids: [Q-DIST-002, Q-PROC-001, Q-PROC-002, Q-PROC-007]
  source_ids: [ncs-introduction, ncs-evaluation-samples, ncs-guide-library]
- id: ncs-sensitive-information-minimization
  title: 편견 유발 정보 최소화
  statement: 지원서에는 직무 관련 정보만 최소한으로 받고 가족ㆍ출신ㆍ신체 등 편견을 유발할 수 있는 정보를 배제한다.
  scope: all_employers_guidance
  question_ids: [Q-DIST-005, Q-DIST-006, Q-DIST-007, Q-INFO-010]
  source_ids: [ncs-introduction, ncs-2025-guide]
- id: ncs-evidence-timing
  title: 입증자료의 후속ㆍ최소 제출
  statement: 졸업ㆍ경력ㆍ자격 입증자료는 필요한 단계에 최소한으로 받고 편견정보를 가려 평가위원에게 제공하지 않는다.
  scope: public_sector_guidance
  question_ids: [Q-INFO-011]
  source_ids: [ncs-2025-guide, ncs-2025-monitoring]
- id: ncs-mixed-role-forms
  title: 직렬별 지원서 분리
  statement: 여러 직렬이나 채용유형을 한 공고에서 모집할 때 자격요건ㆍ제출서류ㆍ지원서 필드를 직렬별로 구분한다.
  scope: public_sector_guidance
  question_ids: [Q-INFO-012]
  source_ids: [ncs-2025-monitoring]
- id: ncs-exception-disclosure
  title: 예외 요건의 근거 공개
  statement: 사회형평 목적이나 직무 특성으로 예외 요건을 둘 때 종류ㆍ범위ㆍ사유와 근거를 공고에 구체적으로 안내한다.
  scope: public_sector_guidance
  question_ids: [Q-DIST-014]
  source_ids: [ncs-2025-monitoring]
- id: ncs-interviewer-blind-controls
  title: 면접위원 정보 차단과 교육
  statement: 면접위원에게 불필요한 지원자 인적사항을 제공하지 않고 사전 블라인드 면접 교육과 이해충돌 확인을 기록한다.
  scope: all_employers_guidance
  question_ids: [Q-PROC-008, Q-PROC-011]
  source_ids: [ncs-introduction, ncs-2025-guide]
- id: ncs-written-assessment-disclosure
  title: 필기평가 직무연계와 사전 공개
  statement: 필기평가 과목은 직무 수행 역량과 연결하고 평가 요소와 일정을 지원 전에 공개한다.
  scope: all_employers_guidance
  question_ids: [Q-PROC-012]
  source_ids: [ncs-introduction, ncs-evaluation-samples]
- id: ncs-post-hire-feedback-loop
  title: 채용 종료 후 평가와 환류
  statement: 채용 종료 후 절차ㆍ결과ㆍ지원자 경험을 평가하고 개선조치와 책임자를 기록한다.
  scope: all_employers_guidance
  question_ids: [Q-PROC-013]
  source_ids: [ncs-process, ncs-2025-guide]
- id: ncs-religion-and-social-status
  title: 종교ㆍ사회적 신분 점검
  statement: 직무와 무관한 종교ㆍ전과ㆍ고용형태ㆍ신원 요건은 근거와 적용 범위를 사람이 검토한다.
  scope: all_employers_guidance
  question_ids: [Q-DIST-012, Q-DIST-013]
  source_ids: [ncs-introduction]
limitations:
- NCS 자료는 법령이나 개별 사건의 법률 자문이 아니라 채용 설계ㆍ운영 지침이다.
- 공공기관 모니터링 사례는 민간기업에 동일한 법적 의무가 있다고 단정하는 근거로 사용하지 않는다.
- 키워드 일치만으로 차별ㆍ위법을 판정하지 않고 직무관련성, 예외 근거와 실제 운영 증거를 사람이 확인한다.
- 2026-09-12 공식 누리집 자료실 목록에서 2026년 공정채용 가이드북 게시 항목을 확인했다. 현재 카탈로그는 게시 항목을 출처로 기록한 것이며, 첨부 원문을 내려받아 조항별 대조한 것은 아니므로 2026년판의 세부 문구를 법적 결론처럼 사용하지 않는다.
